<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"></head><body><div id="panel">
<header><h2>Artboard PDF</h2><p id="document">No document open</p></header>
<div id="selectionBar"><span id="count">0 pages</span><button id="fromPhotoshop" class="quiet" title="Bring the current Photoshop artboard selection into this panel">Update selection</button></div>
<div id="pageArea"><div id="empty"><p>Select artboards in Photoshop.</p><span>Your selected pages will appear here.</span></div><div id="boards" role="list" aria-label="Selected artboards in PDF page order"></div></div>
<div id="orderTools"><span>Page order</span><button id="moveUp" class="quiet" disabled>Move up</button><button id="moveDown" class="quiet" disabled>Move down</button></div>
<div id="controls" role="group" aria-label="Export settings">
<div class="settingsRow"><label for="preset">Compression</label><select id="preset"><option value="Maximum Quality">Maximum Quality</option><option value="Print Quality">Print Quality</option><option value="Balanced">Balanced</option><option value="Small File">Small File</option><option value="Custom">Custom</option></select></div>
<div class="settingsRow"><label for="dpi">Resolution</label><select id="dpi"><option value="0">Original</option><option value="300">300 DPI</option><option value="150">150 DPI</option><option value="96">96 DPI</option><option value="72">72 DPI</option></select></div>
<button id="advancedToggle" class="quiet" aria-expanded="false">Options</button>
<div id="advanced" style="display:none">
<div class="settingsRow"><label for="mode">Output</label><select id="mode"><option value="single">Multipage PDF</option><option value="separate">Separate PDFs</option></select></div>
<div class="settingsRow"><label for="quality">JPEG quality</label><input id="quality" type="number" min="1" max="100"></div>
<div class="settingsRow"><label for="filename">Filename</label><input id="filename" type="text" value="Artboards.pdf"></div>
<label class="checkLabel"><input id="transparent" type="checkbox"> Lossless transparency</label>
<div class="settingsRow"><label for="background">Background</label><input id="background" type="text" value="#ffffff" maxlength="7"></div>
<p class="hint">sRGB. ICC profiles are not embedded. Transparency ignores JPEG quality. Resolution downsamples pixels, keeping the page size. File size varies.</p>
</div></div>
<footer><div class="actions"><button id="export" class="primary" disabled>Export PDF…</button><button id="cancel" style="display:none">Cancel</button></div><progress id="progress" max="1" value="0" style="display:none"></progress><p id="status" role="status" aria-live="polite"></p></footer>
</div><script src="main.js"></script></body></html>
