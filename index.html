<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"></head><body><div id="panel">
<header><div class="wordmark"><h2>BOARD<span>PDF</span></h2><span class="byline">BY SOBR</span></div><img class="bubbles" src="assets/bubbles.svg" alt=""><p id="document" title="Active Photoshop document">No document open</p></header>
<img class="brandStripe" src="assets/brand-stripe.svg" alt="">
<div id="selectionBar"><span id="count">0 pages</span><span class="arrangeHint">Drag to arrange</span><button id="clearAll" class="quiet" title="Clear the plugin list without deleting Photoshop artboards" disabled>Clear all</button><button id="fromPhotoshop" class="quiet" title="Update the selected Photoshop artboards" aria-label="Update selection from Photoshop">Sync</button></div>
<div id="pageArea"><div id="empty"><h3>YOUR PAGES.<br>YOUR ORDER.</h3><p>Select artboards in Photoshop.</p></div><div id="boards" role="list" aria-label="Selected artboards in PDF page order"></div></div>
<div id="orderTools"><span>Page order</span><button id="removeArtboard" class="quiet" title="Remove the selected row from this list only" disabled>Remove</button><button id="moveUp" class="quiet" aria-label="Move selected page up" title="Move selected page up" disabled>↑</button><button id="moveDown" class="quiet" aria-label="Move selected page down" title="Move selected page down" disabled>↓</button></div>
<div id="controls" role="group" aria-label="Export settings">
<div id="quickSettings">
<div class="settingsRow compact"><label for="preset">Compression</label><select id="preset"><option value="Maximum Quality">Maximum</option><option value="Print Quality">Print</option><option value="Balanced">Balanced</option><option value="Small File">Small file</option><option value="Custom">Custom</option></select></div>
<div class="settingsRow compact resolution"><label for="dpi">Resolution</label><select id="dpi"><option value="0">Original</option><option value="300">300 DPI</option><option value="150">150 DPI</option><option value="96">96 DPI</option><option value="72">72 DPI</option></select></div>
</div>
<div id="advanced" style="display:none" role="group" aria-label="Additional export options">
<div class="optionsHeader">EXPORT OPTIONS</div>
<div class="settingsRow"><label for="mode">Output</label><select id="mode"><option value="single">Multipage PDF</option><option value="separate">Separate PDFs</option></select></div>
<div class="settingsRow"><label for="quality">JPEG quality</label><input id="quality" type="number" min="1" max="100"></div>
<div class="settingsRow"><label for="filename">Filename</label><input id="filename" type="text" value="Artboards.pdf"></div>
<label class="checkLabel"><input id="transparent" type="checkbox"> Lossless transparency</label>
<div class="settingsRow"><label for="background">Background</label><input id="background" type="text" value="#ffffff" maxlength="7"></div>
<p class="hint">sRGB. No embedded ICC profile. Transparency ignores JPEG quality. DPI changes pixels, keeping the page size. File size varies.</p>
</div></div>
<footer><div class="actions"><button id="advancedToggle" class="quiet" aria-expanded="false" aria-controls="advanced">Options</button><div class="exportActions"><button id="cancel" style="display:none">Cancel</button><button id="export" class="primary" disabled>Export PDF…</button></div></div><progress id="progress" max="1" value="0" style="display:none"></progress><p id="status" role="status" aria-live="polite"></p></footer>
</div><script src="main.js"></script></body></html>
